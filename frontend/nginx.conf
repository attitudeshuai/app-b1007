server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend
    # Note: Although we can use full URL in axios, proxying can avoid CORS issues if configured.
    # But for this task, backend handles CORS.
    # However, standard practice often uses /api proxy.
    # Let's keep it simple: Frontend talks to Backend URL directly or via proxy.
    # Since we expose ports, direct access is fine.
    # But for cleaner "Desktop App" feel, avoiding different ports in browser bar is nice?
    # No, user will see localhost:3007.
    # We will stick to simple serving.
    
    # Proxy API requests to backend
    # ...
    
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
    
    # Enforce UTF-8
    charset utf-8;
}
